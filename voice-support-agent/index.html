<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Customer Service Support Desk</title>

  <!-- LiveKit browser client -->
  <script
    src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js">
  </script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --accent: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }

    .desk-card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 1.45rem;
      text-align: center;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .status-pill {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background: #0f172a;
      font-size: 0.85rem;
      margin-bottom: 16px;
      color: #38bdf8;
      border: 1px solid var(--border);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-call {
      background: var(--accent);
    }

    .btn-call.connected {
      background: var(--danger);
    }

    .btn-escalate {
      background: var(--warning);
      margin-top: 8px;
      font-size: 0.85rem;
      padding: 10px;
    }

    .ticket-result-box {
      margin-top: 14px;
      padding: 12px;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }

    .ticket-result-box strong {
      color: #93c5fd;
    }

    .section-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 16px;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .transcript-window {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      height: 180px;
      overflow-y: auto;
      padding: 10px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-agent {
      color: #4ade80;
    }

    .msg-user {
      color: #38bdf8;
    }

    .msg-system {
      color: #f59e0b;
      font-style: italic;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 8px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      background: var(--success);
      font-size: 0.9rem;
      padding: 10px;
    }

    .small-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-top: 12px;
    }

    #remoteAudioContainer {
      display: none;
    }
  </style>
</head>

<body>
  <div class="desk-card">
    <h1>Customer Support Desk</h1>

    <div class="subtitle">
      Real-time AI customer service
    </div>

    <div
      id="statusPill"
      class="status-pill"
    >
      Ready to connect
    </div>

    <button
      id="callBtn"
      class="btn btn-call"
    >
      📞 Call Support
    </button>

    <button
      id="escalateBtn"
      class="btn btn-escalate"
      style="display: none;"
    >
      🚨 Escalate to Human
    </button>

    <div
      id="ticketResult"
      class="ticket-result-box"
    >
      <strong>Active Ticket:</strong>
      <span id="ticketNumberDisplay">
        None
      </span>
    </div>

    <span class="section-label">
      Live Transcript
    </span>

    <div
      id="transcript"
      class="transcript-window"
    >
      <span
        id="transcriptPlaceholder"
        style="color: var(--text-muted);"
      >
        Conversation transcript will appear here in real time...
      </span>
    </div>

    <span class="section-label">
      Account &amp; Order Verification
    </span>

    <input
      type="text"
      id="orderInput"
      placeholder="Order ID or Account Name"
      autocomplete="off"
    >

    <input
      type="email"
      id="emailInput"
      placeholder="Email address for ticket receipt"
      autocomplete="email"
    >

    <button
      id="submitDetailsBtn"
      class="btn btn-submit"
    >
      Submit Details to Agent
    </button>

    <div class="small-note">
      Secure real-time AI support
    </div>
  </div>

  <div id="remoteAudioContainer"></div>

  <script>
    "use strict";

    /*
     * =========================================================
     * CONFIGURATION
     * =========================================================
     */

    const TOKEN_ENDPOINT =
      "https://customer-service-agent-xqd2.onrender.com/token";

    const LIVEKIT_URL =
      "wss://customer-service-agent-44fnvuqu.livekit.cloud";


    /*
     * =========================================================
     * DOM ELEMENTS
     * =========================================================
     */

    const callBtn =
      document.getElementById("callBtn");

    const escalateBtn =
      document.getElementById("escalateBtn");

    const statusPill =
      document.getElementById("statusPill");

    const transcript =
      document.getElementById("transcript");

    const initialTranscriptPlaceholder =
      document.getElementById("transcriptPlaceholder");

    const emailInput =
      document.getElementById("emailInput");

    const orderInput =
      document.getElementById("orderInput");

    const submitDetailsBtn =
      document.getElementById("submitDetailsBtn");

    const ticketResult =
      document.getElementById("ticketResult");

    const ticketNumberDisplay =
      document.getElementById("ticketNumberDisplay");

    const remoteAudioContainer =
      document.getElementById("remoteAudioContainer");


    /*
     * =========================================================
     * APPLICATION STATE
     * =========================================================
     */

    let currentRoom = null;
    let connectingCall = false;
    let microphoneRetryTimer = null;


    /*
     * =========================================================
     * GENERAL HELPERS
     * =========================================================
     */

    function wait(milliseconds) {
      return new Promise((resolve) => {
        setTimeout(resolve, milliseconds);
      });
    }


    function checkLiveKit() {
      if (typeof LivekitClient === "undefined") {
        console.error(
          "LiveKit Client library was not loaded."
        );

        statusPill.textContent =
          "LiveKit library failed to load.";

        callBtn.disabled = true;

        return false;
      }

      console.log(
        "LiveKit Client loaded successfully."
      );

      return true;
    }


    function isRoomConnected(room) {
      if (!room) {
        return false;
      }

      return (
        room.state === "connected" ||
        room.state ===
          LivekitClient.ConnectionState?.Connected
      );
    }


    function resetCallInterface() {
      callBtn.textContent =
        "📞 Call Support";

      callBtn.classList.remove(
        "connected"
      );

      callBtn.disabled = false;

      escalateBtn.style.display =
        "none";

      escalateBtn.disabled = false;

      statusPill.textContent =
        "Ready to connect";
    }


    /*
     * =========================================================
     * TRANSCRIPT
     * =========================================================
     */

    function addMessage(sender, text) {
      if (!text) {
        return;
      }

      const placeholder =
        document.getElementById(
          "transcriptPlaceholder"
        );

      if (placeholder) {
        placeholder.remove();
      }

      const item =
        document.createElement("div");

      if (sender === "Agent") {
        item.className = "msg-agent";
      } else if (sender === "User") {
        item.className = "msg-user";
      } else {
        item.className = "msg-system";
      }

      const senderElement =
        document.createElement("strong");

      senderElement.textContent =
        sender + ":";

      const messageElement =
        document.createTextNode(
          " " + text
        );

      item.appendChild(
        senderElement
      );

      item.appendChild(
        messageElement
      );

      transcript.appendChild(item);

      transcript.scrollTop =
        transcript.scrollHeight;

      const ticketMatch =
        text.match(
          /TICK-[A-Z0-9-]+/i
        );

      if (ticketMatch) {
        ticketResult.style.display =
          "block";

        ticketNumberDisplay.textContent =
          ticketMatch[0].toUpperCase();
      }
    }


    /*
     * =========================================================
     * LIVEKIT DATA
     * =========================================================
     */

    function handleDataReceived(payload) {
      try {
        const decodedPayload =
          new TextDecoder().decode(
            payload
          );

        console.log(
          "LiveKit data received:",
          decodedPayload
        );

        const event =
          JSON.parse(decodedPayload);

        if (
          event.type ===
          "transcript"
        ) {
          addMessage(
            event.sender || "Agent",
            event.text || ""
          );

          return;
        }

        if (
          event.type ===
          "ticket_created"
        ) {
          if (event.ticket_id) {
            ticketResult.style.display =
              "block";

            ticketNumberDisplay.textContent =
              event.ticket_id;
          }

          addMessage(
            "System",
            "Ticket created: " +
              (
                event.ticket_id ||
                "Unknown"
              )
          );

          return;
        }

        if (
          event.type ===
          "status"
        ) {
          const statusMessage =
            event.message ||
            event.text ||
            "";

          if (statusMessage) {
            statusPill.textContent =
              statusMessage;
          }
        }
      } catch (error) {
        console.error(
          "Data payload parsing error:",
          error
        );
      }
    }


    /*
     * =========================================================
     * AUDIO CLEANUP
     * =========================================================
     */

    function removeAgentAudio() {
      const audioElements =
        remoteAudioContainer.querySelectorAll(
          "audio"
        );

      audioElements.forEach(
        (audioElement) => {
          try {
            audioElement.pause();
          } catch (error) {
            console.warn(
              "Audio pause warning:",
              error
            );
          }

          audioElement.remove();
        }
      );
    }


    /*
     * =========================================================
     * ROOM CONNECTION WAIT
     * =========================================================
     */

    async function waitForConnectedRoom(
      room,
      timeoutMilliseconds = 15000
    ) {
      if (isRoomConnected(room)) {
        return;
      }

      await new Promise(
        (resolve, reject) => {
          let completed = false;

          const timeoutId =
            setTimeout(() => {
              if (completed) {
                return;
              }

              completed = true;
              cleanup();

              reject(
                new Error(
                  "LiveKit connection timed out."
                )
              );
            }, timeoutMilliseconds);

          function cleanup() {
            clearTimeout(timeoutId);

            room.off(
              LivekitClient.RoomEvent
                .ConnectionStateChanged,
              handleState
            );

            room.off(
              LivekitClient.RoomEvent
                .Disconnected,
              handleDisconnected
            );
          }

          function handleState(state) {
            if (
              state === "connected" ||
              state ===
                LivekitClient
                  .ConnectionState
                  ?.Connected
            ) {
              if (completed) {
                return;
              }

              completed = true;
              cleanup();
              resolve();
            }
          }

          function handleDisconnected() {
            if (completed) {
              return;
            }

            completed = true;
            cleanup();

            reject(
              new Error(
                "LiveKit disconnected while connecting."
              )
            );
          }

          room.on(
            LivekitClient.RoomEvent
              .ConnectionStateChanged,
            handleState
          );

          room.on(
            LivekitClient.RoomEvent
              .Disconnected,
            handleDisconnected
          );
        }
      );
    }


    /*
     * =========================================================
     * MICROPHONE
     * =========================================================
     */

    async function enableMicrophoneWithRetry(
      room,
      maximumAttempts = 3
    ) {
      let lastError = null;

      for (
        let attempt = 1;
        attempt <= maximumAttempts;
        attempt += 1
      ) {
        try {
          if (!isRoomConnected(room)) {
            await waitForConnectedRoom(
              room,
              15000
            );
          }

          /*
           * Wait for the publishing transport to initialize.
           */
          await wait(
            attempt === 1
              ? 1800
              : 3000
          );

          console.log(
            "Microphone publish attempt:",
            attempt
          );

          await room.localParticipant
            .setMicrophoneEnabled(true);

          console.log(
            "Microphone published successfully."
          );

          statusPill.textContent =
            "AI Agent Connected";

          addMessage(
            "System",
            "Microphone connected. You can start speaking."
          );

          return true;
        } catch (error) {
          lastError = error;

          console.warn(
            `Microphone attempt ${attempt} failed:`,
            error
          );

          if (
            attempt <
            maximumAttempts
          ) {
            statusPill.textContent =
              "Retrying microphone connection...";

            await wait(2000);
          }
        }
      }

      console.error(
        "Microphone publication failed:",
        lastError
      );

      statusPill.textContent =
        "Connected, microphone unavailable";

      addMessage(
        "System",
        "The room is connected, but the microphone could not be published. Check microphone permission or try another network."
      );

      /*
       * Do not disconnect the room.
       * The customer can still receive agent audio.
       */
      return false;
    }


    /*
     * =========================================================
     * TOKEN REQUEST
     * =========================================================
     */

    async function fetchLiveKitToken() {
      const controller =
        new AbortController();

      const timeoutId =
        setTimeout(() => {
          controller.abort();
        }, 20000);

      try {
        const response =
          await fetch(
            TOKEN_ENDPOINT,
            {
              method: "GET",
              headers: {
                Accept:
                  "application/json"
              },
              cache: "no-store",
              signal:
                controller.signal
            }
          );

        if (!response.ok) {
          throw new Error(
            "Token request failed. HTTP " +
              response.status
          );
        }

        const data =
          await response.json();

        if (!data.token) {
          throw new Error(
            "Token missing from server response."
          );
        }

        console.log(
          "Token response received."
        );

        return data;
      } finally {
        clearTimeout(timeoutId);
      }
    }


    /*
     * =========================================================
     * ROOM EVENT LISTENERS
     * =========================================================
     */

    function attachRoomListeners(room) {
      room.on(
        LivekitClient.RoomEvent
          .ConnectionStateChanged,
        (state) => {
          console.log(
            "Connection state:",
            state
          );

          if (
            state === "connecting"
          ) {
            statusPill.textContent =
              "Connecting...";
          }

          if (
            state === "connected"
          ) {
            statusPill.textContent =
              "AI Agent Connected";
          }

          if (
            state === "reconnecting"
          ) {
            statusPill.textContent =
              "Reconnecting...";
          }
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .ParticipantConnected,
        (participant) => {
          console.log(
            "Participant connected:",
            participant.identity
          );

          addMessage(
            "System",
            "AI agent joined the support room."
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .ParticipantDisconnected,
        (participant) => {
          console.log(
            "Participant disconnected:",
            participant.identity
          );

          addMessage(
            "System",
            "AI agent disconnected."
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .TrackSubscribed,
        async (
          track,
          publication,
          participant
        ) => {
          console.log(
            "Track subscribed:",
            track.kind,
            participant?.identity
          );

          if (
  track.kind ===
  LivekitClient.Track.Kind.Audio
) {
  const audioElement =
    track.attach();

  audioElement.autoplay = true;
  audioElement.playsInline = true;
  audioElement.muted = false;
  audioElement.volume = 1;

  remoteAudioContainer.appendChild(
    audioElement
  );

  try {
    await currentRoom.startAudio();
    await audioElement.play();

    console.log(
      "Agent audio playback started."
    );

  } catch (error) {
    console.warn(
      "Mobile browser blocked agent audio:",
      error
    );

    statusPill.textContent =
      "Tap the screen to enable audio";

    addMessage(
      "System",
      "Tap anywhere on the screen to enable agent audio."
    );
  }
}

      room.on(
        LivekitClient.RoomEvent
          .TrackUnsubscribed,
        (track) => {
          console.log(
            "Track unsubscribed."
          );

          track.detach().forEach(
            (element) => {
              element.remove();
            }
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .DataReceived,
        (payload) => {
          handleDataReceived(payload);
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .MediaDevicesError,
        (error) => {
          console.error(
            "Media device error:",
            error
          );

          statusPill.textContent =
            "Microphone permission failed";

          addMessage(
            "System",
            "The browser could not access the microphone. Allow microphone permission and retry."
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .Reconnected,
        async () => {
          console.log(
            "LiveKit room reconnected."
          );

          statusPill.textContent =
            "AI Agent Connected";

          await wait(1500);

          try {
            await room.localParticipant
              .setMicrophoneEnabled(true);
          } catch (error) {
            console.warn(
              "Microphone restore failed:",
              error
            );
          }
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .Disconnected,
        (reason) => {
          console.log(
            "Room disconnected:",
            reason
          );

          removeAgentAudio();

          if (
            microphoneRetryTimer
          ) {
            clearTimeout(
              microphoneRetryTimer
            );

            microphoneRetryTimer =
              null;
          }

          currentRoom = null;

          resetCallInterface();
        }
      );
    }


    /*
     * =========================================================
     * CREATE ROOM
     * =========================================================
     */

    function createLiveKitRoom() {
      const room =
        new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
          disconnectOnPageLeave: true,

          /*
           * TURN relay mode is more reliable on restricted
           * office networks, VPNs, and filtered Wi-Fi.
           */
          rtcConfig: {
            iceTransportPolicy: "relay"
          }
        });

      attachRoomListeners(room);

      return room;
    }


    /*
     * =========================================================
     * DISCONNECT
     * =========================================================
     */

    async function disconnectCurrentRoom() {
      if (
        microphoneRetryTimer
      ) {
        clearTimeout(
          microphoneRetryTimer
        );

        microphoneRetryTimer =
          null;
      }

      if (!currentRoom) {
        return;
      }

      const roomToDisconnect =
        currentRoom;

      currentRoom = null;

      try {
        await roomToDisconnect
          .localParticipant
          .setMicrophoneEnabled(false);
      } catch (error) {
        console.warn(
          "Microphone shutdown warning:",
          error
        );
      }

      try {
        await roomToDisconnect
          .disconnect();
      } catch (error) {
        console.warn(
          "Room disconnect warning:",
          error
        );
      }

      removeAgentAudio();
    }


    /*
     * =========================================================
     * CALL SUPPORT
     * =========================================================
     */

    callBtn.addEventListener(
      "click",
      async () => {
        /*
         * End an active call.
         */
        if (
          currentRoom &&
          isRoomConnected(currentRoom)
        ) {
          statusPill.textContent =
            "Ending call...";

          await disconnectCurrentRoom();

          resetCallInterface();

          addMessage(
            "System",
            "Support call ended."
          );

          return;
        }

        if (connectingCall) {
          return;
        }

        if (!checkLiveKit()) {
          return;
        }

        connectingCall = true;
        callBtn.disabled = true;

        statusPill.textContent =
          "Requesting secure access...";

        try {
          /*
           * Remove any incomplete previous connection.
           */
          await disconnectCurrentRoom();

          const tokenData =
            await fetchLiveKitToken();

          currentRoom =
            createLiveKitRoom();

          statusPill.textContent =
            "Connecting to support...";

          /*
           * This call was missing in the previous file.
           */
          await currentRoom.connect(
            LIVEKIT_URL,
            tokenData.token,
            {
              autoSubscribe: true
            }
          );

          await waitForConnectedRoom(
            currentRoom,
            15000
          );

          console.log(
            "Connected to LiveKit."
          );

          /*
           * Start remote agent audio before publishing
           * the microphone.
           */
          try {
            await currentRoom.startAudio();

            console.log(
              "LiveKit audio playback enabled."
            );
          } catch (error) {
            console.warn(
              "Audio playback start warning:",
              error
            );
          }

          /*
           * Mark the room connected before microphone
           * publishing. A microphone error must not end
           * the entire call.
           */
          callBtn.textContent =
            "❌ End Call";

          callBtn.classList.add(
            "connected"
          );

          callBtn.disabled = false;

          escalateBtn.style.display =
            "flex";

          statusPill.textContent =
            "AI Agent Connected";

          addMessage(
            "System",
            "Connected to the AI support room."
          );

          /*
           * Enable the microphone separately.
           */
          const microphoneEnabled =
            await enableMicrophoneWithRetry(
              currentRoom,
              3
            );

          if (
            !microphoneEnabled &&
            currentRoom
          ) {
            /*
             * One delayed retry while the room remains
             * connected.
             */
            microphoneRetryTimer =
              setTimeout(
                async () => {
                  if (
                    currentRoom &&
                    isRoomConnected(
                      currentRoom
                    )
                  ) {
                    await enableMicrophoneWithRetry(
                      currentRoom,
                      1
                    );
                  }
                },
                6000
              );
          }
        } catch (error) {
          console.error(
            "Connection error:",
            error
          );

          if (
            error.name ===
            "AbortError"
          ) {
            statusPill.textContent =
              "Token request timed out.";
          } else {
            statusPill.textContent =
              "Connection failed. Please retry.";
          }

          addMessage(
            "System",
            "Connection failed. Please retry."
          );

          await disconnectCurrentRoom();

          resetCallInterface();
        } finally {
          connectingCall = false;

          if (
            !currentRoom ||
            !isRoomConnected(
              currentRoom
            )
          ) {
            callBtn.disabled = false;
          }
        }
      }
    );


    /*
     * =========================================================
     * SUBMIT CUSTOMER DETAILS
     * =========================================================
     */

    submitDetailsBtn.addEventListener(
      "click",
      async () => {
        const email =
          emailInput.value.trim();

        const order =
          orderInput.value.trim();

        if (
          !currentRoom ||
          !isRoomConnected(
            currentRoom
          )
        ) {
          alert(
            "Please connect the call first."
          );

          return;
        }

        if (
          email &&
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
          )
        ) {
          alert(
            "Please enter a valid email address."
          );

          return;
        }

        if (
          !email &&
          !order
        ) {
          alert(
            "Enter an order ID, account name, or email."
          );

          return;
        }

        const payload =
          JSON.stringify({
            type:
              "email_submission",
            email:
              email,
            order_id:
              order
          });

        try {
          await currentRoom
            .localParticipant
            .publishData(
              new TextEncoder().encode(
                payload
              ),
              {
                reliable: true
              }
            );

          statusPill.textContent =
            "Details submitted to agent.";

          addMessage(
            "System",
            "Your account details were submitted securely."
          );
        } catch (error) {
          console.error(
            "Failed to send details:",
            error
          );

          statusPill.textContent =
            "Failed to submit details.";

          addMessage(
            "System",
            "Your details could not be submitted."
          );
        }
      }
    );


    /*
     * =========================================================
     * HUMAN ESCALATION
     * =========================================================
     */

    escalateBtn.addEventListener(
      "click",
      async () => {
        if (
          !currentRoom ||
          !isRoomConnected(
            currentRoom
          )
        ) {
          addMessage(
            "System",
            "Connect the call before requesting escalation."
          );

          return;
        }

        const payload =
          JSON.stringify({
            type:
              "manual_escalate",
            reason:
              "Customer requested manual escalation"
          });

        try {
          await currentRoom
            .localParticipant
            .publishData(
              new TextEncoder().encode(
                payload
              ),
              {
                reliable: true
              }
            );

          addMessage(
            "System",
            "Your escalation request is being registered."
          );

          statusPill.textContent =
            "Escalation requested";

          escalateBtn.disabled =
            true;
        } catch (error) {
          console.error(
            "Escalation error:",
            error
          );

          addMessage(
            "System",
            "The escalation request could not be sent."
          );
        }
      }
    );


    /*
     * =========================================================
     * PAGE CLEANUP
     * =========================================================
     */

    window.addEventListener(
      "beforeunload",
      () => {
        if (currentRoom) {
          currentRoom.disconnect();
        }
      }
    );
    async function resumeMobileAudio() {
  if (!currentRoom) {
    return;
  }

  try {
    await currentRoom.startAudio();

    const audioElements =
      document.querySelectorAll(
        "#remoteAudioContainer audio"
      );

    for (
      const audioElement of audioElements
    ) {
      audioElement.muted = false;
      audioElement.volume = 1;
      audioElement.playsInline = true;

      try {
        await audioElement.play();
      } catch (error) {
        console.warn(
          "Mobile audio element could not resume:",
          error
        );
      }
    }

    console.log(
      "Mobile agent audio resumed."
    );

  } catch (error) {
    console.warn(
      "LiveKit audio could not resume:",
      error
    );
  }
}


document.addEventListener(
  "click",
  resumeMobileAudio
);


document.addEventListener(
  "touchstart",
  resumeMobileAudio,
  {
    passive: true
  }
);


    /*
     * =========================================================
     * PAGE LOAD
     * =========================================================
     */

    window.addEventListener(
      "load",
      () => {
        console.log(
          "Customer Support Desk loaded."
        );

        if (!checkLiveKit()) {
          return;
        }

        console.log(
          "Ready to connect."
        );
      }
    );
  </script>
</body>
