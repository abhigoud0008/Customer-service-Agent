<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Customer Support Desk</title>

  <script
    src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js">
  </script>

  <style>
    :root {
      --bg: #07101f;
      --card: #1e293b;
      --panel: #0f172a;
      --primary: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow:
        0 14px 40px
        rgba(0, 0, 0, 0.55);
    }

    h1 {
      text-align: center;
      font-size: 1.55rem;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .status {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #38bdf8;
      margin-bottom: 16px;
      text-align: center;
      padding: 10px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 13px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .call {
      background: var(--primary);
    }

    .call.connected {
      background: var(--danger);
    }

    .escalate {
      display: none;
      margin-top: 9px;
      background: var(--warning);
    }

    .submit {
      background: var(--success);
    }

    .label {
      display: block;
      margin: 18px 0 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .transcript {
      height: 210px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .agent {
      color: #4ade80;
    }

    .user {
      color: #38bdf8;
    }

    .system {
      color: #f59e0b;
      font-style: italic;
    }

    input {
      width: 100%;
      min-height: 48px;
      margin-bottom: 9px;
      padding: 11px 13px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 0.94rem;
    }

    input:focus {
      border-color: var(--primary);
    }

    .ticket {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 11px;
    }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 13px;
    }

    #audioContainer {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0.01;
      pointer-events: none;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }

      .card {
        margin-top: 18px;
        padding: 20px;
      }

      .transcript {
        height: 210px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Customer Support Desk</h1>

    <div class="subtitle">
      Real-time AI customer service
    </div>

    <div
      id="status"
      class="status"
      aria-live="polite"
    >
      Ready to connect
    </div>

    <button
      id="call"
      class="call"
      type="button"
    >
      📞 Call Support
    </button>

    <button
      id="escalate"
      class="escalate"
      type="button"
    >
      🚨 Escalate to Human
    </button>

    <div
      id="ticket"
      class="ticket"
    >
      <strong>Active Ticket:</strong>

      <span id="ticketNumber">
        None
      </span>
    </div>

    <span class="label">
      Live Transcript
    </span>

    <div
      id="transcript"
      class="transcript"
      aria-live="polite"
    >
      <span
        id="placeholder"
        style="color: var(--muted);"
      >
        Conversation transcript will appear here in real time...
      </span>
    </div>

    <span class="label">
      Account &amp; Order Verification
    </span>

    <input
      id="order"
      type="text"
      placeholder="Order ID or Account Name"
      autocomplete="off"
    >

    <input
      id="email"
      type="email"
      placeholder="Email address for ticket receipt"
      autocomplete="email"
      inputmode="email"
    >

    <button
      id="submit"
      class="submit"
      type="button"
    >
      Submit Details to Agent
    </button>

    <div class="note">
      Secure real-time AI support
    </div>
  </main>

  <div id="audioContainer"></div>

  <script>
    "use strict";

    console.log(
      "Frontend build: syntax-fixed-8"
    );

    const TOKEN_ENDPOINT =
      "https://customer-service-agent-xqd2.onrender.com/token";

    const LIVEKIT_URL =
      "wss://customer-service-agent-44fnvuqu.livekit.cloud";

    const callButton =
      document.getElementById("call");

    const escalateButton =
      document.getElementById("escalate");

    const submitButton =
      document.getElementById("submit");

    const statusBox =
      document.getElementById("status");

    const transcriptBox =
      document.getElementById("transcript");

    const orderInput =
      document.getElementById("order");

    const emailInput =
      document.getElementById("email");

    const ticketBox =
      document.getElementById("ticket");

    const ticketNumber =
      document.getElementById("ticketNumber");

    const audioContainer =
      document.getElementById("audioContainer");

    let room = null;
    let connecting = false;


    function delay(milliseconds) {
      return new Promise(
        (resolve) => {
          setTimeout(
            resolve,
            milliseconds
          );
        }
      );
    }


    function withTimeout(
      promise,
      milliseconds,
      message
    ) {
      let timer;

      const timeout =
        new Promise(
          (resolve, reject) => {
            timer = setTimeout(
              () => {
                reject(
                  new Error(message)
                );
              },
              milliseconds
            );
          }
        );

      return Promise.race([
        promise,
        timeout
      ]).finally(() => {
        clearTimeout(timer);
      });
    }


    function isConnected() {
      return Boolean(
        room &&
        room.state === "connected"
      );
    }


    function setDisconnectedUi() {
      callButton.textContent =
        "📞 Call Support";

      callButton.classList.remove(
        "connected"
      );

      callButton.disabled = false;

      escalateButton.style.display =
        "none";

      escalateButton.disabled = false;

      statusBox.textContent =
        "Ready to connect";
    }


    function setConnectedUi() {
      callButton.textContent =
        "❌ End Call";

      callButton.classList.add(
        "connected"
      );

      callButton.disabled = false;

      escalateButton.style.display =
        "block";

      statusBox.textContent =
        "Waiting for AI agent...";
    }


    function addMessage(
      sender,
      text
    ) {
      if (!text) {
        return;
      }

      const placeholder =
        document.getElementById(
          "placeholder"
        );

      if (placeholder) {
        placeholder.remove();
      }

      const row =
        document.createElement(
          "div"
        );

      if (sender === "Agent") {
        row.className = "agent";
      } else if (
        sender === "User"
      ) {
        row.className = "user";
      } else {
        row.className = "system";
      }

      const strong =
        document.createElement(
          "strong"
        );

      strong.textContent =
        sender + ":";

      row.appendChild(strong);

      row.appendChild(
        document.createTextNode(
          " " + text
        )
      );

      transcriptBox.appendChild(row);

      transcriptBox.scrollTop =
        transcriptBox.scrollHeight;

      const match =
        text.match(
          /TICK-[A-Z0-9-]+/i
        );

      if (match) {
        ticketBox.style.display =
          "block";

        ticketNumber.textContent =
          match[0].toUpperCase();
      }
    }


    function removeAudio() {
      const audioElements =
        audioContainer.querySelectorAll(
          "audio"
        );

      audioElements.forEach(
        (audioElement) => {
          try {
            audioElement.pause();
          } catch (error) {
            console.warn(
              "Audio pause warning:",
              error
            );
          }

          audioElement.remove();
        }
      );
    }


    async function unlockAudio() {
      if (!room) {
        return;
      }

      try {
        await room.startAudio();

        const audioElements =
          audioContainer.querySelectorAll(
            "audio"
          );

        for (
          const audioElement
          of audioElements
        ) {
          audioElement.muted = false;
          audioElement.volume = 1;
          audioElement.playsInline = true;

          try {
            await audioElement.play();
          } catch (error) {
            console.warn(
              "Audio playback warning:",
              error
            );
          }
        }

        console.log(
          "Audio unlocked."
        );

      } catch (error) {
        console.warn(
          "Audio unlock warning:",
          error
        );
      }
    }


    function handleData(payload) {
      try {
        const decoded =
          new TextDecoder().decode(
            payload
          );

        const event =
          JSON.parse(decoded);

        console.log(
          "Agent data received:",
          event
        );

        if (
          event.type ===
          "transcript"
        ) {
          addMessage(
            event.sender || "Agent",
            event.text || ""
          );

          return;
        }

        if (
          event.type ===
          "status"
        ) {
          statusBox.textContent =
            event.message ||
            event.text ||
            statusBox.textContent;

          return;
        }

        if (
          event.type ===
          "ticket_created"
        ) {
          addMessage(
            "System",
            "Ticket created: " +
              (
                event.ticket_id ||
                "Unknown"
              )
          );
        }

      } catch (error) {
        console.error(
          "Data parsing error:",
          error
        );
      }
    }


    function attachListeners(
      activeRoom
    ) {
      activeRoom.on(
        LivekitClient.RoomEvent
          .ConnectionStateChanged,
        (state) => {
          console.log(
            "Connection state:",
            state
          );

          if (
            room !== activeRoom
          ) {
            return;
          }

          if (
            state === "connecting"
          ) {
            statusBox.textContent =
              "Connecting to AI agent...";
          }

          if (
            state === "reconnecting"
          ) {
            statusBox.textContent =
              "Reconnecting...";
          }
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .ParticipantConnected,
        async (participant) => {
          if (
            room !== activeRoom
          ) {
            return;
          }

          console.log(
            "Participant connected:",
            participant.identity
          );

          statusBox.textContent =
            "AI Agent Connected";

          addMessage(
            "System",
            "AI agent joined the support room."
          );

          await unlockAudio();
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .ParticipantDisconnected,
        (participant) => {
          if (
            room !== activeRoom
          ) {
            return;
          }

          console.log(
            "Participant disconnected:",
            participant.identity
          );

          statusBox.textContent =
            "Waiting for AI agent...";

          addMessage(
            "System",
            "AI agent disconnected."
          );
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .TrackSubscribed,
        async (
          track,
          publication,
          participant
        ) => {
          console.log(
            "Track subscribed:",
            track.kind,
            participant &&
              participant.identity
          );

          if (
            track.kind !==
            LivekitClient.Track.Kind.Audio
          ) {
            return;
          }

          const audioElement =
            track.attach();

          audioElement.autoplay = true;
          audioElement.playsInline = true;
          audioElement.muted = false;
          audioElement.volume = 1;

          audioElement.setAttribute(
            "playsinline",
            ""
          );

          audioElement.setAttribute(
            "webkit-playsinline",
            ""
          );

          audioContainer.appendChild(
            audioElement
          );

          try {
            await activeRoom.startAudio();

            await audioElement.play();

            console.log(
              "Agent audio playback started."
            );

          } catch (error) {
            console.warn(
              "Mobile audio blocked:",
              error
            );

            statusBox.textContent =
              "Tap the screen to enable audio";

            addMessage(
              "System",
              "Tap anywhere on the screen to enable agent audio."
            );
          }
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .TrackUnsubscribed,
        (track) => {
          const detachedElements =
            track.detach();

          detachedElements.forEach(
            (element) => {
              element.remove();
            }
          );
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .DataReceived,
        (payload) => {
          handleData(payload);
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .MediaDevicesError,
        (error) => {
          console.error(
            "Media device error:",
            error
          );

          statusBox.textContent =
            "Microphone permission failed";

          addMessage(
            "System",
            "Allow microphone permission and reconnect."
          );
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .Reconnected,
        async () => {
          await unlockAudio();
        }
      );


      activeRoom.on(
        LivekitClient.RoomEvent
          .Disconnected,
        (reason) => {
          console.log(
            "Room disconnected:",
            reason
          );

          if (
            room !== activeRoom
          ) {
            return;
          }

          room = null;

          removeAudio();

          setDisconnectedUi();
        }
      );
    }


    async function requestToken() {
      const controller =
        new AbortController();

      const timer =
        setTimeout(
          () => {
            controller.abort();
          },
          20000
        );

      try {
        const response =
          await fetch(
            TOKEN_ENDPOINT,
            {
              method: "GET",

              headers: {
                Accept:
                  "application/json"
              },

              cache:
                "no-store",

              signal:
                controller.signal
            }
          );

        if (!response.ok) {
          throw new Error(
            "Token server returned HTTP " +
              response.status
          );
        }

        const data =
          await response.json();

        if (!data.token) {
          throw new Error(
            "Token missing from response."
          );
        }

        console.log(
          "Token received."
        );

        return data;

      } finally {
        clearTimeout(timer);
      }
    }


    async function publishMicrophone(
      activeRoom
    ) {
      try {
        await delay(1500);

        await withTimeout(
          activeRoom
            .localParticipant
            .setMicrophoneEnabled(
              true
            ),

          25000,

          "Microphone publishing timed out."
        );

        statusBox.textContent =
          "AI Agent Connected";

        addMessage(
          "System",
          "Microphone connected. You can start speaking."
        );

        console.log(
          "Microphone connected."
        );

      } catch (error) {
        console.error(
          "Microphone error:",
          error
        );

        statusBox.textContent =
          "Connected, microphone unavailable";

        addMessage(
          "System",
          "The room is connected, but microphone access failed. Check browser permission."
        );
      }
    }


    async function disconnectRoom() {
      const activeRoom =
        room;

      room = null;

      if (!activeRoom) {
        return;
      }

      try {
        if (
          activeRoom.state ===
          "connected"
        ) {
          await activeRoom
            .localParticipant
            .setMicrophoneEnabled(
              false
            );
        }

      } catch (error) {
        console.warn(
          "Microphone shutdown warning:",
          error
        );
      }

      try {
        await activeRoom.disconnect();

      } catch (error) {
        console.warn(
          "Room disconnect warning:",
          error
        );
      }

      removeAudio();
    }


    callButton.addEventListener(
      "click",
      async () => {
        if (room) {
          statusBox.textContent =
            "Ending call...";

          await disconnectRoom();

          setDisconnectedUi();

          addMessage(
            "System",
            "Support call ended."
          );

          return;
        }

        if (connecting) {
          return;
        }

        if (
          typeof LivekitClient ===
          "undefined"
        ) {
          statusBox.textContent =
            "LiveKit library failed to load";

          return;
        }

        connecting = true;

        callButton.disabled = true;

        statusBox.textContent =
          "Requesting secure access...";

        let activeRoom = null;

        try {
          const tokenData =
            await requestToken();

          activeRoom =
            new LivekitClient.Room({
              adaptiveStream: true,
              dynacast: true,
              disconnectOnPageLeave: true
            });

          attachListeners(
            activeRoom
          );

          room =
            activeRoom;

          statusBox.textContent =
            "Connecting to AI agent...";

          await withTimeout(
            activeRoom.connect(
              LIVEKIT_URL,
              tokenData.token,
              {
                autoSubscribe: true
              }
            ),

            25000,

            "LiveKit connection timed out."
          );

          if (
            room !== activeRoom
          ) {
            return;
          }

          console.log(
            "Connected to LiveKit room:",
            activeRoom.name
          );

          setConnectedUi();

          addMessage(
            "System",
            "Connected to the AI support room."
          );

          try {
            await activeRoom.startAudio();

          } catch (error) {
            console.warn(
              "Audio startup warning:",
              error
            );
          }

          if (
            activeRoom
              .remoteParticipants
              .size > 0
          ) {
            statusBox.textContent =
              "AI Agent Connected";
          }

          await publishMicrophone(
            activeRoom
          );

          await unlockAudio();

        } catch (error) {
          console.error(
            "Connection error:",
            error
          );

          if (
            error.name ===
            "AbortError"
          ) {
            statusBox.textContent =
              "Token request timed out.";

          } else {
            statusBox.textContent =
              error.message ||
              "Connection failed.";
          }

          addMessage(
            "System",
            statusBox.textContent
          );

          if (
            room === activeRoom
          ) {
            room = null;
          }

          if (activeRoom) {
            try {
              await activeRoom.disconnect();

            } catch (
              disconnectError
            ) {
              console.warn(
                "Disconnect error:",
                disconnectError
              );
            }
          }

          removeAudio();

          setDisconnectedUi();

        } finally {
          connecting = false;

          if (!room) {
            callButton.disabled =
              false;
          }
        }
      }
    );


    submitButton.addEventListener(
      "click",
      async () => {
        if (!isConnected()) {
          alert(
            "Please connect the call first."
          );

          return;
        }

        const email =
          emailInput.value.trim();

        const orderId =
          orderInput.value.trim();

        const emailPattern =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (
          email &&
          !emailPattern.test(email)
        ) {
          alert(
            "Please enter a valid email address."
          );

          return;
        }

        if (
          !email &&
          !orderId
        ) {
          alert(
            "Enter an order ID, account name, or email."
          );

          return;
        }

        const payload =
          JSON.stringify({
            type:
              "email_submission",

            email:
              email,

            order_id:
              orderId
          });

        try {
          await room
            .localParticipant
            .publishData(
              new TextEncoder()
                .encode(payload),

              {
                reliable: true
              }
            );

          statusBox.textContent =
            "Details submitted to agent";

          addMessage(
            "System",
            "Your account details were submitted securely."
          );

        } catch (error) {
          console.error(
            "Details submission error:",
            error
          );

          addMessage(
            "System",
            "Your details could not be submitted."
          );
        }
      }
    );


    escalateButton.addEventListener(
      "click",
      async () => {
        if (!isConnected()) {
          return;
        }

        const payload =
          JSON.stringify({
            type:
              "manual_escalate",

            reason:
              "Customer requested manual escalation"
          });

        try {
          await room
            .localParticipant
            .publishData(
              new TextEncoder()
                .encode(payload),

              {
                reliable: true
              }
            );

          escalateButton.disabled =
            true;

          statusBox.textContent =
            "Escalation requested";

          addMessage(
            "System",
            "Your escalation request is being registered."
          );

        } catch (error) {
          console.error(
            "Escalation error:",
            error
          );

          addMessage(
            "System",
            "The escalation request could not be submitted."
          );
        }
      }
    );


    document.addEventListener(
      "touchstart",
      unlockAudio,
      {
        passive: true
      }
    );


    document.addEventListener(
      "click",
      unlockAudio
    );


    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.visibilityState ===
          "visible"
        ) {
          unlockAudio();
        }
      }
    );


    window.addEventListener(
      "beforeunload",
      () => {
        if (room) {
          room.disconnect();
        }
      }
    );


    window.addEventListener(
      "load",
      () => {
        if (
          typeof LivekitClient ===
          "undefined"
        ) {
          statusBox.textContent =
            "LiveKit library failed to load";

          callButton.disabled =
            true;

        } else {
          console.log(
            "LiveKit Client loaded successfully."
          );
        }
      }
    );
  </script>
</body>
</html>
