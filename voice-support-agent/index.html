<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Customer Service Support Desk</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }
    .desk-card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    h1 { font-size: 1.45rem; text-align: center; margin-bottom: 4px; font-weight: 700; }
    .subtitle { text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 18px; }
    .status-pill {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background: #0f172a;
      font-size: 0.85rem;
      margin-bottom: 16px;
      color: #38bdf8;
      border: 1px solid var(--border);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease;
    }
    .btn-call { background: var(--accent); }
    .btn-call.connected { background: var(--danger); }
    .btn-escalate { background: var(--warning); margin-top: 8px; font-size: 0.85rem; padding: 10px; }
    .ticket-result-box {
      margin-top: 14px;
      padding: 12px;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }
    .ticket-result-box strong { color: #93c5fd; }
    .section-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 16px;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .transcript-window {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      height: 150px;
      overflow-y: auto;
      padding: 10px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-agent { color: #4ade80; }
    .msg-user { color: #38bdf8; }
    .msg-system { color: #f59e0b; font-style: italic; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 8px;
      outline: none;
    }
    .btn-submit { background: var(--success); font-size: 0.9rem; padding: 10px; }
  </style>
</head>
<body>
  <div class="desk-card">
    <h1>Support Desk</h1>
    <div class="subtitle">Real-time ticket creation</div>

    <div id="statusPill" class="status-pill">Ready to connect</div>

    <button id="callBtn" class="btn btn-call">📞 Call Support</button>
    <button id="escalateBtn" class="btn btn-escalate" style="display: none;">🚨 Escalate to Human</button>

    <div id="ticketResult" class="ticket-result-box">
      <strong>Active Ticket:</strong> <span id="ticketNumberDisplay">None</span>
    </div>

    <span class="section-label">Live Transcript</span>
    <div id="transcript" class="transcript-window">
      <span style="color: var(--text-muted);">Conversation transcript will appear here in real time...</span>
    </div>

    <span class="section-label">Account & Order Verification</span>
    <input type="text" id="orderInput" placeholder="Order ID or Account Name" />
    <input type="email" id="emailInput" placeholder="Email address for ticket receipt" />
    <button id="submitDetailsBtn" class="btn btn-submit">Submit Details to Agent</button>
  </div>

  <script>
    const TOKEN_ENDPOINT = "https://customer-service-agent-xqd2.onrender.com/token";
    const LIVEKIT_URL = "wss://customer-service-agent-44fnvuqu.livekit.cloud";

    const callBtn = document.getElementById("callBtn");
    const escalateBtn = document.getElementById("escalateBtn");
    const statusPill = document.getElementById("statusPill");
    const transcript = document.getElementById("transcript");
    const emailInput = document.getElementById("emailInput");
    const orderInput = document.getElementById("orderInput");
    const submitDetailsBtn = document.getElementById("submitDetailsBtn");
    const ticketResult = document.getElementById("ticketResult");
    const ticketNumberDisplay = document.getElementById("ticketNumberDisplay");

    let room = null;

    function addMessage(sender, text) {
      if (transcript.children.length === 1 && transcript.children[0].tagName === "SPAN") {
        transcript.innerHTML = "";
      }
      const item = document.createElement("div");
      if (sender === "Agent") item.className = "msg-agent";
      else if (sender === "User") item.className = "msg-user";
      else item.className = "msg-system";

      item.innerHTML = <strong>${sender}:</strong> ${text};
      transcript.appendChild(item);
      transcript.scrollTop = transcript.scrollHeight;

      // Extract ticket ID from speech
      const match = text.match(/(TICK-[A-Z0-9]+)/i);
      if (match) {
        ticketResult.style.display = "block";
        ticketNumberDisplay.textContent = match[1];
      }
    }

    callBtn.addEventListener("click", async () => {
      if (room && room.state === "connected") {
        await room.disconnect();
        return;
      }

      try {
        statusPill.textContent = "Connecting to agent...";
        callBtn.disabled = true;

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        const res = await fetch(TOKEN_ENDPOINT, { signal: controller.signal });
        clearTimeout(timeout);

        if (!res.ok) throw new Error("Could not fetch token");
        const data = await res.json();

        room = new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
        });

        // Mobile-friendly audio element attachment
        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") {
            const el = track.attach();
            el.id = "agent-audio";
            el.autoplay = true;
            document.body.appendChild(el);
            el.play().catch(e => console.warn("Waiting for browser audio unlock", e));
          }
        });

        // Live transcript ingestion
        room.on(LivekitClient.RoomEvent.DataReceived, (payload) => {
          try {
            const evt = JSON.parse(new TextDecoder().decode(payload));
            if (evt.type === "transcript") {
              addMessage(evt.sender, evt.text);
            }
          } catch (e) {
            console.error("Data decode error:", e);
          }
        });

        room.on(LivekitClient.RoomEvent.Disconnected, () => {
          const el = document.getElementById("agent-audio");
          if (el) el.remove();
          callBtn.textContent = "📞 Call Support";
          callBtn.classList.remove("connected");
          callBtn.disabled = false;
          escalateBtn.style.display = "none";
          statusPill.textContent = "Call completed";
        });

        await room.connect(LIVEKIT_URL, data.token);
        await room.localParticipant.setMicrophoneEnabled(true);

        callBtn.textContent = "❌ End Call";
        callBtn.classList.add("connected");
        callBtn.disabled = false;
        escalateBtn.style.display = "block";
        statusPill.textContent = "Agent active (Sub-second latency)";
      } catch (err) {
        console.error(err);
        statusPill.textContent = "Connection issue. Please tap Call again.";
        callBtn.disabled = false;
      }
    });

    submitDetailsBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const order = orderInput.value.trim();

      if (!room || room.state !== "connected") {
        alert("Please start the call first.");
        return;
      }

      const payload = JSON.stringify({
        type: "email_submission",
        email: email,
        order_id: order
      });

      await room.localParticipant.publishData(new TextEncoder().encode(payload), { reliable: true });
      statusPill.textContent = "Details submitted to active agent.";
      addMessage("User", Submitted Order/Email: ${order || "N/A"} | ${email || "N/A"});
    });

    escalateBtn.addEventListener("click", async () => {
      if (!room || room.state !== "connected") return;
      const payload = JSON.stringify({ type: "manual_escalate" });
      await room.localParticipant.publishData(new TextEncoder().encode(payload), { reliable: true });
      addMessage("User", "[Requested Immediate Human Escalation]");
    });
  </script>
</body>
</html>
