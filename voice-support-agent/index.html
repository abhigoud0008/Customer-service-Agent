<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Customer Service Support Desk</title>

  <!-- LiveKit Browser Client -->
  <script
    src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js">
  </script>

  <style>
    :root {
      --background: #07101f;
      --card: #1e293b;
      --panel: #0f172a;
      --primary: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--background);
      color: var(--text);
    }

    .desk-card {
      width: 100%;
      max-width: 460px;
      padding: 26px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
    }

    h1 {
      margin-bottom: 6px;
      font-size: 1.6rem;
      font-weight: 750;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .status-pill {
      min-height: 48px;
      margin-bottom: 18px;
      padding: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #38bdf8;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      text-align: center;
    }

    .button {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .call-button {
      background: var(--primary);
    }

    .call-button.connected {
      background: var(--danger);
    }

    .escalate-button {
      margin-top: 10px;
      background: var(--warning);
    }

    .submit-button {
      min-height: 48px;
      background: var(--success);
      font-size: 0.92rem;
    }

    .section-label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    .transcript-window {
      height: 220px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.87rem;
      line-height: 1.5;
    }

    .message-agent {
      color: #4ade80;
    }

    .message-user {
      color: #38bdf8;
    }

    .message-system {
      color: #f59e0b;
      font-style: italic;
    }

    .ticket-result {
      display: none;
      margin-top: 16px;
      padding: 13px;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      font-size: 0.88rem;
    }

    .ticket-result strong {
      color: #bfdbfe;
    }

    input {
      width: 100%;
      min-height: 50px;
      margin-bottom: 10px;
      padding: 12px 14px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--primary);
    }

    input::placeholder {
      color: #64748b;
    }

    .small-note {
      margin-top: 15px;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
    }

    #audioContainer {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }

      .desk-card {
        margin-top: 20px;
        padding: 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 1.45rem;
      }

      .transcript-window {
        height: 210px;
      }
    }
  </style>
</head>

<body>
  <main class="desk-card">
    <h1>Customer Support Desk</h1>

    <div class="subtitle">
      Real-time AI customer service
    </div>

    <div
      id="statusPill"
      class="status-pill"
      aria-live="polite"
    >
      Ready to connect
    </div>

    <button
      id="callButton"
      class="button call-button"
      type="button"
    >
      📞 Call Support
    </button>

    <button
      id="escalateButton"
      class="button escalate-button"
      type="button"
      style="display: none;"
    >
      🚨 Escalate to Human
    </button>

    <div
      id="ticketResult"
      class="ticket-result"
    >
      <strong>Active Ticket:</strong>

      <span id="ticketNumber">
        None
      </span>
    </div>

    <span class="section-label">
      Live Transcript
    </span>

    <div
      id="transcript"
      class="transcript-window"
      aria-live="polite"
    >
      <span
        id="transcriptPlaceholder"
        style="color: var(--muted);"
      >
        Conversation transcript will appear here in real time...
      </span>
    </div>

    <span class="section-label">
      Account &amp; Order Verification
    </span>

    <input
      id="orderInput"
      type="text"
      placeholder="Order ID or Account Name"
      autocomplete="off"
    >

    <input
      id="emailInput"
      type="email"
      placeholder="Email address for ticket receipt"
      autocomplete="email"
      inputmode="email"
    >

    <button
      id="submitButton"
      class="button submit-button"
      type="button"
    >
      Submit Details to Agent
    </button>

    <div class="small-note">
      Secure real-time AI support
    </div>
  </main>

  <!-- LiveKit attaches agent audio elements here -->
  <div id="audioContainer"></div>

  <script>
    "use strict";

    /*
     * =====================================================
     * BUILD IDENTIFIER
     * =====================================================
     */

    console.log(
      "Customer Support frontend build: mobile-audio-fix-7"
    );


    /*
     * =====================================================
     * CONFIGURATION
     * =====================================================
     */

    const TOKEN_ENDPOINT =
      "https://customer-service-agent-xqd2.onrender.com/token";

    const LIVEKIT_URL =
      "wss://customer-service-agent-44fnvuqu.livekit.cloud";


    /*
     * =====================================================
     * DOM REFERENCES
     * =====================================================
     */

    const callButton =
      document.getElementById(
        "callButton"
      );

    const escalateButton =
      document.getElementById(
        "escalateButton"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );

    const statusPill =
      document.getElementById(
        "statusPill"
      );

    const transcript =
      document.getElementById(
        "transcript"
      );

    const orderInput =
      document.getElementById(
        "orderInput"
      );

    const emailInput =
      document.getElementById(
        "emailInput"
      );

    const ticketResult =
      document.getElementById(
        "ticketResult"
      );

    const ticketNumber =
      document.getElementById(
        "ticketNumber"
      );

    const audioContainer =
      document.getElementById(
        "audioContainer"
      );


    /*
     * =====================================================
     * APPLICATION STATE
     * =====================================================
     */

    let currentRoom = null;
    let connectionInProgress = false;
    let mobileAudioUnlocked = false;


    /*
     * =====================================================
     * BASIC HELPERS
     * =====================================================
     */

    function delay(milliseconds) {
      return new Promise(
        (resolve) => {
          setTimeout(
            resolve,
            milliseconds
          );
        }
      );
    }


    function withTimeout(
      promise,
      timeoutMilliseconds,
      message
    ) {
      let timeoutId;

      const timeoutPromise =
        new Promise(
          (resolve, reject) => {
            timeoutId = setTimeout(
              () => {
                reject(
                  new Error(message)
                );
              },
              timeoutMilliseconds
            );
          }
        );

      return Promise.race([
        promise,
        timeoutPromise
      ]).finally(() => {
        clearTimeout(timeoutId);
      });
    }


    function isConnected(room) {
      return Boolean(
        room &&
        room.state === "connected"
      );
    }


    function checkLiveKitLibrary() {
      if (
        typeof LivekitClient ===
        "undefined"
      ) {
        console.error(
          "LiveKit Client library did not load."
        );

        statusPill.textContent =
          "LiveKit library failed to load";

        callButton.disabled = true;

        return false;
      }

      console.log(
        "LiveKit Client loaded successfully."
      );

      return true;
    }


    /*
     * =====================================================
     * UI HELPERS
     * =====================================================
     */

    function showConnectedInterface() {
      callButton.textContent =
        "❌ End Call";

      callButton.classList.add(
        "connected"
      );

      callButton.disabled = false;

      escalateButton.style.display =
        "block";

      escalateButton.disabled = false;
    }


    function resetInterface() {
      callButton.textContent =
        "📞 Call Support";

      callButton.classList.remove(
        "connected"
      );

      callButton.disabled = false;

      escalateButton.style.display =
        "none";

      escalateButton.disabled = false;

      statusPill.textContent =
        "Ready to connect";
    }


    /*
     * =====================================================
     * TRANSCRIPT
     * =====================================================
     */

    function addMessage(
      sender,
      text
    ) {
      if (!text) {
        return;
      }

      const placeholder =
        document.getElementById(
          "transcriptPlaceholder"
        );

      if (placeholder) {
        placeholder.remove();
      }

      const message =
        document.createElement(
          "div"
        );

      if (sender === "Agent") {
        message.className =
          "message-agent";
      } else if (
        sender === "User"
      ) {
        message.className =
          "message-user";
      } else {
        message.className =
          "message-system";
      }

      const senderLabel =
        document.createElement(
          "strong"
        );

      senderLabel.textContent =
        sender + ":";

      const messageText =
        document.createTextNode(
          " " + text
        );

      message.appendChild(
        senderLabel
      );

      message.appendChild(
        messageText
      );

      transcript.appendChild(
        message
      );

      transcript.scrollTop =
        transcript.scrollHeight;

      const ticketMatch =
        text.match(
          /TICK-[A-Z0-9-]+/i
        );

      if (ticketMatch) {
        ticketResult.style.display =
          "block";

        ticketNumber.textContent =
          ticketMatch[0].toUpperCase();
      }
    }


    /*
     * =====================================================
     * DATA RECEIVED FROM AGENT
     * =====================================================
     */

    function processAgentData(payload) {
      try {
        const decodedPayload =
          new TextDecoder().decode(
            payload
          );

        console.log(
          "Agent data received:",
          decodedPayload
        );

        const event =
          JSON.parse(
            decodedPayload
          );

        if (
          event.type ===
          "transcript"
        ) {
          addMessage(
            event.sender || "Agent",
            event.text || ""
          );

          return;
        }

        if (
          event.type ===
          "status"
        ) {
          const statusMessage =
            event.message ||
            event.text ||
            "";

          if (statusMessage) {
            statusPill.textContent =
              statusMessage;
          }

          return;
        }

        if (
          event.type ===
          "ticket_created"
        ) {
          if (event.ticket_id) {
            ticketResult.style.display =
              "block";

            ticketNumber.textContent =
              event.ticket_id;
          }

          addMessage(
            "System",
            "Ticket created: " +
              (
                event.ticket_id ||
                "Unknown"
              )
          );
        }
      } catch (error) {
        console.error(
          "Agent data parsing failed:",
          error
        );
      }
    }


    /*
     * =====================================================
     * MOBILE AUDIO
     * =====================================================
     */

    async function unlockMobileAudio() {
      if (!currentRoom) {
        return;
      }

      try {
        await currentRoom.startAudio();

        mobileAudioUnlocked =
          true;

        const audioElements =
          audioContainer.querySelectorAll(
            "audio"
          );

        for (
          const audioElement
          of audioElements
        ) {
          audioElement.autoplay =
            true;

          audioElement.playsInline =
            true;

          audioElement.muted =
            false;

          audioElement.volume =
            1;

          try {
            await audioElement.play();
          } catch (playError) {
            console.warn(
              "Audio element did not resume:",
              playError
            );
          }
        }

        console.log(
          "Mobile audio playback unlocked."
        );
      } catch (error) {
        console.warn(
          "Mobile audio unlock warning:",
          error
        );
      }
    }


    function removeAgentAudio() {
      const audioElements =
        audioContainer.querySelectorAll(
          "audio"
        );

      audioElements.forEach(
        (audioElement) => {
          try {
            audioElement.pause();
          } catch (error) {
            console.warn(
              "Audio pause warning:",
              error
            );
          }

          audioElement.remove();
        }
      );

      mobileAudioUnlocked =
        false;
    }


    /*
     * =====================================================
     * TOKEN REQUEST
     * =====================================================
     */

    async function requestToken() {
      const controller =
        new AbortController();

      const timeoutId =
        setTimeout(
          () => {
            controller.abort();
          },
          20000
        );

      try {
        const response =
          await fetch(
            TOKEN_ENDPOINT,
            {
              method: "GET",
              headers: {
                Accept:
                  "application/json"
              },
              cache: "no-store",
              signal:
                controller.signal
            }
          );

        if (!response.ok) {
          throw new Error(
            "Token server returned HTTP " +
              response.status
          );
        }

        const data =
          await response.json();

        if (!data.token) {
          throw new Error(
            "The token response was invalid."
          );
        }

        console.log(
          "Token received.",
          {
            room: data.room,
            participant:
              data.participant
          }
        );

        return data;
      } finally {
        clearTimeout(
          timeoutId
        );
      }
    }


    /*
     * =====================================================
     * MICROPHONE
     * =====================================================
     */

    async function testMicrophonePermission() {
      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices
          .getUserMedia
      ) {
        throw new Error(
          "Microphone access is unavailable in this browser."
        );
      }

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });

      stream
        .getTracks()
        .forEach(
          (track) => {
            track.stop();
          }
        );

      console.log(
        "Microphone permission confirmed."
      );
    }


    async function publishMicrophone(
      room
    ) {
      try {
        await testMicrophonePermission();

        if (
          currentRoom !== room ||
          !isConnected(room)
        ) {
          return false;
        }

        /*
         * Give the LiveKit publishing transport time
         * to initialize before publishing the track.
         */
        await delay(1800);

        await withTimeout(
          room.localParticipant
            .setMicrophoneEnabled(
              true
            ),
          25000,
          "Microphone publishing timed out."
        );

        console.log(
          "Microphone published successfully."
        );

        statusPill.textContent =
          "AI Agent Connected";

        addMessage(
          "System",
          "Microphone connected. You can start speaking."
        );

        return true;
      } catch (error) {
        console.error(
          "Microphone publishing failed:",
          error
        );

        statusPill.textContent =
          "Connected, microphone unavailable";

        addMessage(
          "System",
          "The room is connected, but microphone access failed. Check browser permission and reconnect."
        );

        /*
         * Do not disconnect the room.
         * The customer can still hear the agent.
         */
        return false;
      }
    }


    /*
     * =====================================================
     * ROOM EVENT LISTENERS
     * =====================================================
     */

    function attachRoomListeners(
      room
    ) {
      room.on(
        LivekitClient.RoomEvent
          .ConnectionStateChanged,
        (state) => {
          console.log(
            "Connection state:",
            state
          );

          if (
            currentRoom !== room
          ) {
            return;
          }

          if (state === "connecting") {
            statusPill.textContent =
              "Connecting to AI agent...";
          }

          if (state === "connected") {
            statusPill.textContent =
              "Waiting for AI agent...";
          }

          if (state === "reconnecting") {
            statusPill.textContent =
              "Reconnecting...";
          }
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .ParticipantConnected,
        async (participant) => {
          console.log(
            "Participant connected:",
            participant.identity
          );

          if (
            currentRoom !== room
          ) {
            return;
          }

          statusPill.textContent =
            "AI Agent Connected";

          addMessage(
            "System",
            "AI agent joined the support room."
          );

          /*
           * Mobile browsers sometimes need another
           * attempt after the agent joins.
           */
          await unlockMobileAudio();
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .ParticipantDisconnected,
        (participant) => {
          console.log(
            "Participant disconnected:",
            participant.identity
          );

          if (
            currentRoom !== room
          ) {
            return;
          }

          statusPill.textContent =
            "Waiting for AI agent...";

          addMessage(
            "System",
            "AI agent disconnected."
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .TrackSubscribed,
        async (
          track,
          publication,
          participant
        ) => {
          console.log(
            "Track subscribed:",
            track.kind,
            participant?.identity
          );

          if (
            track.kind !==
            LivekitClient.Track.Kind.Audio
          ) {
            return;
          }

          const audioElement =
            track.attach();

          audioElement.autoplay =
            true;

          audioElement.playsInline =
            true;

          audioElement.muted =
            false;

          audioElement.volume =
            1;

          audioElement.setAttribute(
            "playsinline",
            ""
          );

          audioElement.setAttribute(
            "webkit-playsinline",
            ""
          );

          audioContainer.appendChild(
            audioElement
          );

          try {
            await room.startAudio();

            await audioElement.play();

            mobileAudioUnlocked =
              true;

            console.log(
              "Agent audio playback started."
            );

            statusPill.textContent =
              "AI Agent Connected";
          } catch (error) {
            console.warn(
              "Mobile browser blocked agent audio:",
              error
            );

            mobileAudioUnlocked =
              false;

            statusPill.textContent =
              "Tap the screen to enable audio";

            addMessage(
              "System",
              "Tap anywhere on the screen to enable the agent audio."
            );
          }
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .TrackUnsubscribed,
        (track) => {
          const detachedElements =
            track.detach();

          detachedElements.forEach(
            (element) => {
              element.remove();
            }
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .DataReceived,
        (payload) => {
          processAgentData(
            payload
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .MediaDevicesError,
        (error) => {
          console.error(
            "Media device error:",
            error
          );

          if (
            currentRoom !== room
          ) {
            return;
          }

          statusPill.textContent =
            "Microphone permission failed";

          addMessage(
            "System",
            "The browser could not access the microphone. Allow microphone access and reconnect."
          );
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .Reconnected,
        async () => {
          console.log(
            "Room reconnected."
          );

          if (
            currentRoom !== room
          ) {
            return;
          }

          statusPill.textContent =
            "AI Agent Connected";

          await unlockMobileAudio();
        }
      );


      room.on(
        LivekitClient.RoomEvent
          .Disconnected,
        (reason) => {
          console.log(
            "Room disconnected:",
            reason
          );

          if (
            currentRoom !== room
          ) {
            return;
          }

          currentRoom = null;

          removeAgentAudio();

          resetInterface();
        }
      );
    }


    /*
     * =====================================================
     * ROOM CREATION
     * =====================================================
     */

    function createRoom() {
      const room =
        new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
          disconnectOnPageLeave: true
        });

      attachRoomListeners(
        room
      );

      return room;
    }


    /*
     * =====================================================
     * DISCONNECT
     * =====================================================
     */

    async function disconnectRoom() {
      const room =
        currentRoom;

      currentRoom = null;

      if (!room) {
        removeAgentAudio();
        return;
      }

      try {
        if (
          room.state === "connected"
        ) {
          await room.localParticipant
            .setMicrophoneEnabled(
              false
            );
        }
      } catch (error) {
        console.warn(
          "Microphone shutdown warning:",
          error
        );
      }

      try {
        await room.disconnect();
      } catch (error) {
        console.warn(
          "Room disconnect warning:",
          error
        );
      }

      removeAgentAudio();
    }


    /*
     * =====================================================
     * START OR END CALL
     * =====================================================
     */

    callButton.addEventListener(
      "click",
      async () => {
        /*
         * The button click is a valid mobile user gesture.
         * Use the gesture to prepare audio playback.
         */
        if (currentRoom) {
          statusPill.textContent =
            "Ending call...";

          await disconnectRoom();

          resetInterface();

          addMessage(
            "System",
            "Support call ended."
          );

          return;
        }

        if (connectionInProgress) {
          return;
        }

        if (!checkLiveKitLibrary()) {
          return;
        }

        connectionInProgress =
          true;

        callButton.disabled =
          true;

        statusPill.textContent =
          "Requesting secure access...";

        let room = null;

        try {
          const tokenData =
            await requestToken();

          room =
            createRoom();

          currentRoom =
            room;

          statusPill.textContent =
            "Connecting to AI agent...";

          await withTimeout(
            room.connect(
              LIVEKIT_URL,
              tokenData.token,
              {
                autoSubscribe: true
              }
            ),
            25000,
            "LiveKit connection timed out."
          );

          if (
            currentRoom !== room
          ) {
            await room.disconnect();
            return;
          }

          console.log(
            "Connected to LiveKit.",
            {
              room:
                room.name,
              state:
                room.state,
              participant:
                room.localParticipant
                  .identity
            }
          );

          showConnectedInterface();

          if (
            room.remoteParticipants
              .size > 0
          ) {
            statusPill.textContent =
              "AI Agent Connected";
          } else {
            statusPill.textContent =
              "Waiting for AI agent...";
          }

          addMessage(
            "System",
            "Connected to the AI support room."
          );

          /*
           * Start incoming audio while still inside
           * the original mobile button gesture.
           */
          try {
            await room.startAudio();

            mobileAudioUnlocked =
              true;

            console.log(
              "LiveKit audio playback enabled."
            );
          } catch (audioError) {
            mobileAudioUnlocked =
              false;

            console.warn(
              "Initial mobile audio warning:",
              audioError
            );
          }

          /*
           * Check participants already present before
           * ParticipantConnected listener ran.
           */
          room.remoteParticipants.forEach(
            (participant) => {
              console.log(
                "Existing remote participant:",
                participant.identity
              );
            }
          );

          await publishMicrophone(
            room
          );

          /*
           * Retry audio after microphone permission.
           */
          await unlockMobileAudio();

        } catch (error) {
          console.error(
            "Call connection failed:",
            error
          );

          if (
            error.name ===
            "AbortError"
          ) {
            statusPill.textContent =
              "Token request timed out.";
          } else {
            statusPill.textContent =
              error.message ||
              "Connection failed. Please retry.";
          }

          addMessage(
            "System",
            statusPill.textContent
          );

          if (
            currentRoom === room
          ) {
            currentRoom = null;
          }

          if (room) {
            try {
              await room.disconnect();
            } catch (
              disconnectError
            ) {
              console.warn(
                "Disconnect warning:",
                disconnectError
              );
            }
          }

          removeAgentAudio();

          callButton.textContent =
            "📞 Call Support";

          callButton.classList.remove(
            "connected"
          );

          callButton.disabled =
            false;

          escalateButton.style.display =
            "none";

        } finally {
          connectionInProgress =
            false;

          if (!currentRoom) {
            callButton.disabled =
              false;
          }
        }
      }
    );


    /*
     * =====================================================
     * SUBMIT ACCOUNT DETAILS
     * =====================================================
     */

    submitButton.addEventListener(
      "click",
      async () => {
        const email =
          emailInput.value.trim();

        const orderId =
          orderInput.value.trim();

        if (
          !currentRoom ||
          !isConnected(currentRoom)
        ) {
          alert(
            "Please connect the call first."
          );

          return;
        }

        if (
          email &&
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
        ) {
          alert(
            "Please enter a valid email address."
          );

          return;
        }

        if (
          !email &&
          !orderId
        ) {
          alert(
            "Enter an order ID, account name, or email."
          );

          return;
        }

        const payload =
          JSON.stringify({
            type:
              "email_submission",
            email:
              email,
            order_id:
              orderId
          });

        try {
          await currentRoom
            .localParticipant
            .publishData(
              new TextEncoder().encode(
                payload
              ),
              {
                reliable: true
              }
            );

          statusPill.textContent =
            "Details submitted to agent";

          addMessage(
            "System",
            "Your account details were submitted securely."
          );
        } catch (error) {
          console.error(
            "Details submission failed:",
            error
          );

          statusPill.textContent =
            "Details submission failed";

          addMessage(
            "System",
            "Your details could not be submitted."
          );
        }
      }
    );


    /*
     * =====================================================
     * ESCALATION
     * =====================================================
     */

    escalateButton.addEventListener(
      "click",
      async () => {
        if (
          !currentRoom ||
          !isConnected(currentRoom)
        ) {
          addMessage(
            "System",
            "Connect the call before requesting escalation."
          );

          return;
        }

        const payload =
          JSON.stringify({
            type:
              "manual_escalate",
            reason:
              "Customer requested manual escalation"
          });

        try {
          await currentRoom
            .localParticipant
            .publishData(
              new TextEncoder().encode(
                payload
              ),
              {
                reliable: true
              }
            );

          escalateButton.disabled =
            true;

          statusPill.textContent =
            "Escalation requested";

          addMessage(
            "System",
            "Your escalation request is being registered."
          );
        } catch (error) {
          console.error(
            "Escalation request failed:",
            error
          );

          addMessage(
            "System",
            "The escalation request could not be submitted."
          );
        }
      }
    );


    /*
     * =====================================================
     * MOBILE AUDIO RESUME EVENTS
     * =====================================================
     */

    document.addEventListener(
      "touchstart",
      () => {
        if (
          currentRoom &&
          !mobileAudioUnlocked
        ) {
          unlockMobileAudio();
        }
      },
      {
        passive: true
      }
    );


    document.addEventListener(
      "click",
      () => {
        if (
          currentRoom &&
          !mobileAudioUnlocked
        ) {
          unlockMobileAudio();
        }
      }
    );


    document.addEventListener(
      "visibilitychange",
      async () => {
        if (
          document.visibilityState ===
            "visible" &&
          currentRoom
        ) {
          await unlockMobileAudio();
        }
      }
    );


    /*
     * =====================================================
     * PAGE CLEANUP
     * =====================================================
     */

    window.addEventListener(
      "beforeunload",
      () => {
        if (currentRoom) {
          currentRoom.disconnect();
        }
      }
    );


    /*
     * =====================================================
     * PAGE STARTUP
     * =====================================================
     */

    window.addEventListener(
      "load",
      () => {
        console.log(
          "Customer Support Desk loaded."
        );

        if (!checkLiveKitLibrary()) {
          return;
        }

        console.log(
          "Ready to connect."
        );
      }
    );
  </script>
</body>
</html>
